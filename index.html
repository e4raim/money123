    const cnt={};rest.forEach(x=>{const t=x.o?x.o.type:'?';cnt[t]=(cnt[t]||0)+1});
    const co=(egrn.byCad[cad]||[]).filter(x=>x.fio!==rec.fio);
    port=`<div class="port">
      <div class="port-h"><b>Портфель собственника</b>${flats.length>1?`<span class="pbadge">инвестор · ${flats.length} кв.</span>`:''}</div>
      ${flats.map(x=>{const cur=x.o.num===num;
        return `<div class="pobj ${cur?'cur':''}" ${cur?'':`onclick="jumpTo('${x.o.num}')"`}>
          <span class="pi">🏠</span>
          <span class="pm">${x.o.num}<small>${x.o.area} м² · ${x.o.floor} эт.</small></span>
          ${cur?'<span class="ptag">эта</span>':'<span class="pgo">→</span>'}
        </div>`;}).join('')}
      ${Object.keys(cnt).length?`<div class="pextra">Прочее: ${Object.entries(cnt).map(([t,n])=>`${typeIcon(t)} ${typeLabel(t)} — ${n}`).join(' · ')}<br><span style="opacity:.75">${rest.map(x=>x.o?x.o.num:'—').join(', ')}</span></div>`:''}
      ${co.length?`<div class="pextra" style="border-color:#E3CBA0;color:#8a6d2b">Долевая собственность: <span class="pii">${co.map(c=>esc(c.fio)+(c.share?` (${c.share})`:'')).join(', ')}</span></div>`:''}
    </div>`;
  }

  const ni=schemaInfo[num]||{};
  const qedit=`<div class="qedit">
      <div style="font-size:11.5px;color:var(--brass);font-weight:700;letter-spacing:.3px;text-transform:uppercase">Заметка по квартире</div>
      <textarea id="cellNote" placeholder="живут собственники · ремонт, через год продают · сдают в аренду…">${esc(ni.note||'')}</textarea>
    </div>`;
  const body=`${info}${port}${qedit}
    <div style="font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-top:14px;margin-bottom:2px">Соседние квартиры</div>
    <div class="nb-grid">
      <div class="nb" style="visibility:hidden"></div>${nb(k,f+1,p,'этаж выше')}<div class="nb" style="visibility:hidden"></div>
      ${nb(k,f,p-1,'слева')}<div class="nb mid"><span>эта</span><b>${num}</b></div>${nb(k,f,p+1,'справа')}
      <div class="nb" style="visibility:hidden"></div>${nb(k,f-1,p,'этаж ниже')}<div class="nb" style="visibility:hidden"></div>
    </div>`;
  document.getElementById('cellTitle').textContent='Квартира '+num;
  document.getElementById('cellBody').innerHTML=body;
  document.getElementById('cellFoot').innerHTML=`<button class="del" style="color:var(--ink-soft);border-color:var(--line)" onclick="closeCell()">Закрыть</button><button class="save" onclick="quickSave()">Сохранить заметку</button><button class="save" style="background:#4a4a48;flex:none" onclick="cellToCard()">Карточка</button>`;
  document.getElementById('cellOverlay').classList.add('show');
  renderSchema();
}
function jumpTo(numStr){
  const d=decodeApt(numStr);if(!d)return;
  if(state.view!=='schema')switchView('schema');
  openCell(d.k,d.f,d.p);
}
/* ---------- карточка человека ---------- */
let _person=null;
function openPerson(fio){
  _person=fio;
  const objs=ownerObjects(fio);
  const rec=objs[0]||{fio,phone:'',share:''};
  const flats=objs.map(r=>({r,o:objOfCad(r.cad)})).filter(x=>x.o&&x.o.type==='kv');
  const rest=objs.map(r=>({r,o:objOfCad(r.cad)})).filter(x=>!x.o||x.o.type!=='kv');
  const g=groupOf(fio);
  const fam=g?g.members.filter(m=>normFio(m)!==normFio(fio)):[];
  const phones=[...new Set(groupMembers(fio).map(m=>{const o=ownerObjects(m)[0];return o&&o.phone?m+': '+o.phone:null;}).filter(Boolean))];

  /* заметки по всем его квартирам */
  const notes=[];
  flats.forEach(x=>{const ni=schemaInfo[x.o.num];if(ni&&ni.note)notes.push({num:x.o.num,note:ni.note});});
  /* карточки актуалки по его квартирам */
  const cards=flats.map(x=>items.find(o=>o.apartment===x.o.num)).filter(Boolean);

  let famTotal=0;groupMembers(fio).forEach(m=>{famTotal+=ownerObjects(m).filter(r=>{const o=objOfCad(r.cad);return o&&o.type==='kv';}).length;});

  const h=`
    <div class="pers-top">
      <div class="pers-name">${esc(fio)}</div>
      <div class="pers-sub">${rec.phone?'☎ '+esc(rec.phone):'телефон не указан'}${rec.share&&rec.share!=='1/1'?' · доля '+esc(rec.share):''}</div>
      ${flats.length>1?`<span class="pbadge" style="margin-top:7px;display:inline-block">инвестор · ${flats.length} кв.</span>`:''}
      ${ownerFix[cadKey(rec.cad||'')]?'<span class="fixmark">данные скорректированы вручную</span>':''}
    </div>

    <div class="sec">
      <div class="sec-h"><b>Квартиры (${flats.length})</b></div>
      ${flats.length?flats.map(x=>{
        const card=items.find(o=>o.apartment===x.o.num);
        const st=card?(STATUS[card.dealStatus||'base']||{}).label:'';
        return `<div class="pobj" onclick="closePerson();jumpTo('${x.o.num}')">
          <span class="pi">🏠</span>
          <span class="pm">${x.o.num}<small>${x.o.area} м² · ${x.o.floor} эт.${st?' · '+st:''}</small></span>
          <span class="pgo">→</span></div>`;}).join(''):'<div class="empty2">нет квартир в базе</div>'}
      ${rest.length?`<div class="pextra">Прочее: ${rest.map(x=>x.o?typeIcon(x.o.type)+' '+x.o.num:'—').join(', ')}</div>`:''}
    </div>

    <div class="sec">
      <div class="sec-h"><b>Семья / связанные лица</b>
        ${g?`<span class="pbadge" style="background:var(--fam)" onclick="renameGroup('${jq(fio)}');openPerson('${jq(fio)}')">${esc(g.name)} · ${famTotal} кв.</span>`:'<span class="pbadge" style="background:var(--base)">не связан</span>'}</div>
      ${fam.length?fam.map(m=>{
        const mo=ownerObjects(m),mf=mo.filter(r=>{const o=objOfCad(r.cad);return o&&o.type==='kv';});
        return `<div class="mem">
          <div class="av">${esc((m.split(' ')[0]||' ')[0]+((m.split(' ')[1]||' ')[0]||''))}</div>
          <div class="in" onclick="openPerson('${jq(m)}')">${esc(m)}<small>${mf.length} кв. · ${mf.map(r=>objOfCad(r.cad).num).join(', ')||'—'}</small></div>
          <button class="rm" title="убрать из группы" onclick="unlinkPerson('${jq(m)}');openPerson('${jq(fio)}')">×</button>
        </div>`;}).join(''):'<div class="empty2">пока ни с кем не связан</div>'}
      <button class="addbtn" onclick="openLink('${jq(fio)}')">+ Связать с человеком</button>
      ${phones.length>1?`<div class="pextra">Телефоны группы:<br>${phones.map(esc).join('<br>')}</div>`:''}
    </div>

    ${notes.length?`<div class="sec">
      <div class="sec-h"><b>Заметки по квартирам</b></div>
      ${notes.map(n=>`<div class="noteline" onclick="closePerson();jumpTo('${n.num}')"><b>${n.num}</b> ${esc(n.note)}</div>`).join('')}
    </div>`:''}

    ${cards.length?`<div class="sec">
      <div class="sec-h"><b>В актуалке (${cards.length})</b></div>
      ${cards.map(c=>`<div class="noteline" onclick="closePerson();openModal('${c.id}')"><b>${esc(c.apartment)}</b> ${(STATUS[c.dealStatus||'base']||{}).label} · ${STATE_LABEL[stateOf(c)]}${c.price?' · '+esc(c.price):''}</div>`).join('')}
    </div>`:''}`;

  document.getElementById('personTitle').textContent='Собственник';
  document.getElementById('personBody').innerHTML=h;
  document.getElementById('personFoot').innerHTML=`<button class="del" style="color:var(--ink-soft);border-color:var(--line)" onclick="closePerson()">Закрыть</button><button class="save" onclick="editOwner('${jq(fio)}')">Изменить данные</button>`;
  document.getElementById('personOverlay').classList.add('show');
}
function closePerson(){document.getElementById('personOverlay').classList.remove('show')}

/* --- правка данных собственника --- */
function editOwner(fio){
  const objs=ownerObjects(fio);
  if(!objs.length){alert('Нет объектов для правки');return;}
  const list=objs.map((r,i)=>{const o=objOfCad(r.cad);return `${i+1}. ${o?o.num:r.cad}`;}).join('\n');
  const pick=objs.length===1?'1':prompt('Какой объект правим?\n'+list+'\n\nНомер строки:','1');
  if(!pick)return;
  const idx=parseInt(pick)-1;const r=objs[idx];if(!r)return;
  const o=objOfCad(r.cad),key=cadKey(r.cad),cur=ownerFix[key]||{};
  const nf=prompt('ФИО собственника'+(o?' ('+o.num+')':'')+':',cur.fio||r.fio||'');
  if(nf===null)return;
  const np=prompt('Телефон:',cur.phone||r.phone||'');
  if(np===null)return;
  const nn=prompt('Комментарий (например: продал в марте 2026):',cur.note||'');
  if(nn===null)return;
  if(!nf.trim()){delete ownerFix[key];}
  else ownerFix[key]={fio:nf.trim().toUpperCase(),phone:(np||'').trim(),note:(nn||'').trim(),ts:Date.now()};
  saveOwnerFix();
  if(state.view==='schema')renderSchema();
  openPerson(nf.trim()?nf.trim().toUpperCase():fio);
}

/* --- выбор человека для связи --- */
let _linkFor=null;
function openLink(fio){
  _linkFor=fio;
  document.getElementById('linkQ').value='';
  fillLink();
  document.getElementById('linkOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('linkQ').focus(),60);
}
function closeLink(){document.getElementById('linkOverlay').classList.remove('show')}
function allOwners(){
  const set=new Map();
  Object.keys(egrn.byOwner||{}).forEach(k=>{const r=egrn.byOwner[k][0];if(r&&r.fio)set.set(normFio(r.fio),r.fio);});
  Object.values(ownerFix).forEach(f=>{if(f&&f.fio)set.set(normFio(f.fio),f.fio);});
  return [...set.values()];
}
function fillLink(){
  const fio=_linkFor,q=(document.getElementById('linkQ').value||'').trim().toLowerCase();
  const mem=groupMembers(fio).map(normFio);
  let list=allOwners().filter(f=>!mem.includes(normFio(f)));
  if(q)list=list.filter(f=>{
    const objs=ownerObjects(f),ph=(objs[0]||{}).phone||'';
    return f.toLowerCase().includes(q)
      || objs.some(r=>{const o=objOfCad(r.cad);return o&&o.num.toLowerCase().includes(q);})
      || (q.replace(/\D/g,'').length>2&&ph.replace(/\D/g,'').includes(q.replace(/\D/g,'')));
  });
  list=list.slice(0,40);
  document.getElementById('linkCount').textContent=q?`найдено: ${list.length}`:`всего: ${allOwners().length-mem.length}`;
  document.getElementById('linkList').innerHTML=list.length?list.map(f=>{
    const objs=ownerObjects(f),fl=objs.map(r=>objOfCad(r.cad)).filter(o=>o&&o.type==='kv');
    const same=f.split(' ')[0]===fio.split(' ')[0];
    return `<div class="lrow" onclick="linkPeople('${jq(fio)}','${jq(f)}');closeLink();openPerson('${jq(fio)}')">
      ${esc(f)}${same?' <span style="color:var(--fam);font-size:11px">· однофамилец</span>':''}
      <small>${fl.length} кв.${fl.length?' · '+fl.map(o=>o.num).join(', '):''}</small></div>`;}).join('')
    :'<div class="empty2">никого не найдено</div>';
}
function quickSave(){
  if(!_cell)return;const {k,f,p}=_cell,num=encodeApt(k,f,p);
  const cad=cadOfApt(num);
  const note=document.getElementById('cellNote').value;
  if(!note.trim()) delete schemaInfo[num];
  else schemaInfo[num]={cad,note,ts:Date.now()};
  saveSchemaInfo();renderSchema();openCell(k,f,p);
}
function cellToCard(){
  if(!_cell)return;const {k,f,p}=_cell,num=encodeApt(k,f,p),ex=cardAt(k,f,p);
  closeCell();
  if(ex){openModal(ex.id);return;}
  openModalForApt(num);
  const cad=cadOfApt(num),obj=objOfNum(num);
  if(cad){document.getElementById('fld_cadastral').value=cad;egrnLookup();}
  if(obj&&!document.getElementById('fld_area').value)document.getElementById('fld_area').value=obj.area;
  const rec=ownerRecOfCad(cad);
  if(rec){
    const setIf=(id,v)=>{const el=document.getElementById(id);if(el&&!el.value&&v)el.value=v;};
    setIf('fld_ownerName',rec.fio);setIf('fld_ownerPhone',rec.phone);setIf('fld_share',rec.share);
  }
  const ni=schemaInfo[num];
  if(ni&&ni.note){const n=document.getElementById('fld_notes');if(n&&!n.value)n.value=ni.note;}
}
function closeCell(){document.getElementById('cellOverlay').classList.remove('show');}
function openModalForApt(num){openModal();document.getElementById('fld_apartment').value=num;}

/* ---------- глобальный поиск-подсказка ---------- */
function globalSuggest(q){
  q=(q||'').trim().toLowerCase();
  if(q.length<2)return null;
  const digits=q.replace(/\D/g,'');
  const out={people:[],apts:[],groups:[]};
  /* люди */
  allOwners().forEach(f=>{
    if(out.people.length>=6)return;
    const objs=ownerObjects(f),ph=(objs[0]||{}).phone||'';
    const hit=f.toLowerCase().includes(q)||(digits.length>2&&ph.replace(/\D/g,'').includes(digits));
    if(hit)out.people.push({fio:f,objs});
  });
  /* квартиры и объекты */
  Object.keys(HYDE_OBJ).forEach(suf=>{
    if(out.apts.length>=6)return;
    const v=HYDE_OBJ[suf],num=v[0];
    if(num.toLowerCase().includes(q)||suf.includes(q)||(HYDE_PREFIX+suf).includes(q))
      out.apts.push({num,area:v[1],floor:v[2],cad:HYDE_PREFIX+suf});
  });
  /* группы */
  groups.forEach(g=>{if(out.groups.length<4&&(g.name||'').toLowerCase().includes(q))out.groups.push(g);});
  return out;
}
function renderSuggest(){
  const box=document.getElementById('sugBox');if(!box)return;
  const q=document.getElementById('q').value;
  const r=globalSuggest(q);
  if(!r||(!r.people.length&&!r.apts.length&&!r.groups.length)){box.classList.remove('show');box.innerHTML='';return;}
  let h='';
  if(r.people.length){
    h+='<div class="sg-h">Собственники</div>';
    h+=r.people.map(p=>{
      const fl=p.objs.map(x=>objOfCad(x.cad)).filter(o=>o&&o.type==='kv');
      const g=groupOf(p.fio);
      return `<div class="sg-row" onclick="pickSuggestPerson('${jq(p.fio)}')">
        <span class="sg-ic">👤</span><span class="sg-m pii">${esc(p.fio)}
        <small>${fl.length} кв.${fl.length?' · '+fl.map(o=>o.num).join(', '):''}${g?' · '+esc(g.name):''}</small></span></div>`;}).join('');
  }
  if(r.apts.length){
    h+='<div class="sg-h">Объекты</div>';
    h+=r.apts.map(a=>{
      const own=ownerRecOfCad(a.cad),ni=schemaInfo[a.num];
      return `<div class="sg-row" onclick="pickSuggestApt('${a.num}')">
        <span class="sg-ic">${typeIcon(objTypeOf(a.num))}</span><span class="sg-m">${a.num}
        <small>${a.area} м² · ${a.floor} эт.${own?' · '+esc(own.fio):''}${ni&&ni.note?' · 📝':''}</small></span></div>`;}).join('');
  }
  if(r.groups.length){
    h+='<div class="sg-h">Семьи</div>';
    h+=r.groups.map(g=>`<div class="sg-row" onclick="pickSuggestPerson('${jq(g.members[0])}')">
      <span class="sg-ic">👪</span><span class="sg-m">${esc(g.name)}<small>${g.members.length} чел.</small></span></div>`).join('');
  }
  box.innerHTML=h;box.classList.add('show');
}
function pickSuggestPerson(fio){hideSuggest();openPerson(fio);}
function pickSuggestApt(num){
  hideSuggest();
  if(objTypeOf(num)==='kv')jumpTo(num);
  else{const r=ownerRecOfCad(cadOfNum(num));if(r)openPerson(r.fio);else alert('Объект '+num+' — собственник не найден (загрузи базу ЕГРН)');}
}
function hideSuggest(){const b=document.getElementById('sugBox');if(b){b.classList.remove('show');b.innerHTML='';}}

/* ---------- конфигурация комплекса ---------- */
function loadComplexFile(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const c=JSON.parse(e.target.result);
      if(!c||!c.objects||!c.towers)throw new Error('в файле нет объектов или корпусов');
      const n=Object.keys(c.objects).length;
      if(!confirm(`Конфигурация: ${n} объектов, ${c.towers.length} корпуса.\nЗагрузить в облако?`)){input.value='';return;}
      if(cloud&&auxRef){auxRef.child('complex').set(c).then(()=>alert('Конфигурация загружена в облако.'));}
      else{applyComplex(c);try{localStorage.setItem('actualka_complex',JSON.stringify(c));}catch(err){}
        alert('Загружено локально (облако не подключено).');renderSettings();}
    }catch(err){alert('Не удалось прочитать файл: '+err.message);}
    input.value='';
  };
  r.readAsText(f,'utf-8');
}
function exportComplex(){
  if(!COMPLEX)return;
  const blob=new Blob([JSON.stringify(COMPLEX)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='complex-config.json';a.click();
}

/* ---------- режим приватности / быстрая блокировка ---------- */
function togglePrivacy(){
  const on=!document.body.classList.contains('privacy');
  document.body.classList.toggle('privacy',on);
  document.getElementById('privBtn').classList.toggle('on',on);
  try{localStorage.setItem('actualka_priv',on?'1':'0');}catch(e){}
}
function applyPrivacy(){
  let on=false;try{on=localStorage.getItem('actualka_priv')==='1';}catch(e){}
  document.body.classList.toggle('privacy',on);
  const b=document.getElementById('privBtn');if(b)b.classList.toggle('on',on);
}
function lockNow(){
  hideSuggest();closeModal();closeCell();closePerson();closeLink();closeReport();
  if(cloud&&window.firebase&&firebase.auth&&firebase.auth().currentUser){
    localStorage.removeItem('actualka_seen');
    firebase.auth().signOut();
  }else{
    const g=document.getElementById('authGate');if(g)g.classList.add('show');
  }
}

/* ---------- wire up ---------- */
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;render();renderSuggest();});
document.getElementById('q').addEventListener('focus',renderSuggest);
document.addEventListener('click',e=>{if(!e.target.closest('.search'))hideSuggest();});
document.getElementById('personOverlay').addEventListener('click',e=>{if(e.target.id==='personOverlay')closePerson()});
document.getElementById('linkOverlay').addEventListener('click',e=>{if(e.target.id==='linkOverlay')closeLink()});
document.getElementById('linkQ').addEventListener('input',fillLink);
document.getElementById('fPay').addEventListener('change',e=>{state.pay=e.target.value;render()});
document.getElementById('fState').addEventListener('change',e=>{state.objState=e.target.value;render()});
document.getElementById('fSort').addEventListener('change',e=>{state.sort=e.target.value;render()});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
document.getElementById('reportOverlay').addEventListener('click',e=>{if(e.target.id==='reportOverlay')closeReport()});
document.getElementById('cellOverlay').addEventListener('click',e=>{if(e.target.id==='cellOverlay')closeCell()});
document.addEventListener('mousemove',e=>{if(state.view==='schema'&&e.target.closest&&e.target.closest('.schemaWrap'))schemaTip(e);else if(!e.target.closest||!e.target.closest('.brick'))document.getElementById('schemaTip').style.display='none';});
document.getElementById('viewSchema').addEventListener('mouseleave',()=>{document.getElementById('schemaTip').style.display='none';});
window.addEventListener('resize',()=>{if(state.view==='schema')fitSchema();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeReport();closeCell();closePerson();closeLink();hideSuggest();}});

setJkLabel();
applyPrivacy();
loadAuxLocal();
buildStateFilter();
loadEgrnFromStorage();
initStore();
</script>
